<!DOCTYPE html>
<html>
<head>
    <title>Move Car</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, sans-serif;
        }

        
        #road {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid black;
        }

        #car {
            width: 150px;
            position: absolute;
            left: 0px;
            top: 50px;
            transition: left 0.5s ease;
        }

        button {
            padding: 10px 20px;
            margin-top: 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Move the Car</h2>

<div id="road">
    <img id="car" 
         src="https://i.imgur.com/3Wb8KQK.png" 
         alt="Car">
</div>

<button onclick="moveCar()">Move Forward</button>

<script>

let position = 0;

function moveCar() {
    position += 50; 
    document.getElementById("car").style.left = position + "px";
}

</script>

    
</body>
</html>
