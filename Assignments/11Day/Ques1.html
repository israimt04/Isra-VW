<!DOCTYPE html>
<html>
<head>
    <title>Birthday Surprise</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .birthday-style {
            font-size: 50px;
            font-weight: bold;
            color: gold;
            text-shadow: 2px 2px 10px red;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px red; }
            to { text-shadow: 0 0 20px blue; }
        }

        img {
            margin-top: 20px;
            width: 200px;
        }
    </style>
</head>
<body>

<h4>There is a message for you!!</h4>

<p id="message">wait..</p>

<button onclick="changeText()">Click here to get it!</button>

<script>

let clickCount = 0;
let fontSize = 16;
const colors = ["red", "blue", "green", "purple", "orange"];

function changeText() {
    clickCount++;
    const message = document.getElementById("message");

    if (clickCount <= 4) {
        fontSize += 20;
        message.style.fontSize = fontSize + "px";
        message.style.color = colors[Math.floor(Math.random() * colors.length)];
    }

    if (clickCount === 4) {
        message.innerHTML = "🎉 Happy Birthday 🎂";
        message.classList.add("birthday-style");
        message.style.fontSize = "";
        message.style.color = "";

        const img = document.createElement("img");
        img.src = "https://media.giphy.com/media/3oz8xKaR836UJOYeOc/giphy.gif";
        document.body.appendChild(img);

        document.querySelector("button").style.display = "none";
    }
}

</script>

</body>
</html>
